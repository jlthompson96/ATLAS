[project]
name = "atlas-hostd"
version = "0.1.0"
description = "ATLAS atlas-hostd: Windows LLM-host agent (status, GPU telemetry, sleep policy, keep-awake leases)"
requires-python = ">=3.13"
# Zero runtime dependencies on purpose: standard library only (asyncio, ctypes, tomllib).
dependencies = []

[project.scripts]
atlas-hostd = "atlas_hostd.__main__:main"
atlas-hostd-helper = "atlas_hostd.helper:main"
atlas-hostd-wol = "atlas_hostd.wol:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["atlas_hostd*"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "ASYNC", "PTH"]
ignore = [
    "E501",    # formatter owns line length
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S104"]  # assert is how pytest works; tests bind loopback
# Windows built-in tools (powercfg, wevtutil, typeperf) are run by absolute path with fixed arguments.
"atlas_hostd/platform/windows.py" = ["S603"]
"atlas_hostd/wol.py" = ["S104"]  # broadcast address 255.255.255.255 is the point of the tool

[tool.mypy]
python_version = "3.13"
# Type-check the Windows (ctypes) code on a Mac. Also run `mypy --platform linux` / `--platform darwin` to check
# the non-Windows branches.
platform = "win32"
strict = true
packages = ["atlas_hostd"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["jsonschema.*", "referencing.*", "yaml.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
