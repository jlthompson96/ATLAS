[project]
name = "atlas"
version = "0.0.0"
description = "ATLAS backend (Raspberry Pi services)"
requires-python = ">=3.13"
# Runtime dependencies stay empty until a phase needs one. Every addition is a reviewed change
# to the hash-pinned lockfiles (CLAUDE.md, "Dependencies").
dependencies = []

[project.optional-dependencies]
# Dev-machine tooling only: the mock event server and contract validation. Never installed on the Pi.
mock = [
    "websockets>=17",
    "jsonschema>=4.23",
]
dev = [
    "pytest>=8",
    "ruff>=0.8",
    "mypy>=1.13",
    "pyyaml>=6",
    "openapi-spec-validator>=0.7",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["atlas*"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "ASYNC", "PTH"]
ignore = [
    "E501",    # formatter owns line length; long JSON-ish literals in tests are fine
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # assert is how pytest works

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["atlas"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["jsonschema.*", "openapi_spec_validator.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
