# The Pi services (contracts/services.md section 1, host = Pi). tests/test_deploy_structure.py checks this list
# against services.md, so a service added there but not here fails CI.
#
# name            enable
#   enable=yes: provision-pi.sh enables the unit and atlas-release restarts it on activation.
#   enable=no : installed as a template; enable it in the phase that delivers the service.
atlas-audit       yes
atlas-egress      yes
atlas-core        yes
atlas-voice       no
atlas-ui          yes
atlas-google      no
atlas-discord     no
atlas-executor    no
atlas-research    no
atlas-search      no
atlas-panels      no
atlas-market      no
atlas-fallback    no
atlas-kiosk       no
atlas-backup      no
